name: Policy Checks

on:
  pull_request:
    paths:
      - 'policies/**'
      - 'policies.hcl'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@c015bac31e4f720f35bb0ac793383ac1cf90bc76 # v2
        with:
          version: v1.21.x

      - name: Check Rego Syntax
        run: make check

      - name: Run Unit Tests
        run: make test
