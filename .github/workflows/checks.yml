name: Policy Checks

on:
  pull_request:
    paths:
      - 'policies/**'
      - 'testcases/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup OPA
        uses: open-policy-agent/setup-opa@c015bac31e4f720f35bb0ac793383ac1cf90bc76 # v2
        with:
          version: v1.21.x

      - name: Install Conftest
        run: |
          VERSION=0.71.1
          ARCH=$(arch)
          SYSTEM=$(uname)

          wget "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_${SYSTEM}_${ARCH}.tar.gz"

          gh attestation verify "conftest_${VERSION}_${SYSTEM}_${ARCH}.tar.gz" \
            --repo open-policy-agent/conftest \
            --signer-workflow open-policy-agent/conftest/.github/workflows/release.yaml \
            --source-ref "refs/tags/v${VERSION}" \
            --deny-self-hosted-runners
          tar -xzf "conftest_${VERSION}_${SYSTEM}_${ARCH}.tar.gz"
          sudo mv conftest /usr/local/bin

      - name: Check fmt
        run: opa fmt -l --fail policies/

      - name: Check Rego Syntax
        run: make check

      - name: Run Unit Tests
        run: make unit-test

      - name: Run integration tests
        run: make test
